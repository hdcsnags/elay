name: android
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --console=plain
      - name: Unit tests (shared, host)
        run: ./gradlew :shared:allTests --console=plain
      - name: Require executed tests (no hollow green)
        run: |
          count=$(grep -rho 'tests="[0-9]*"' shared/build/test-results --include="TEST-*.xml" | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "executed tests: ${count:-0}"
          test "${count:-0}" -gt 0
      - name: Assemble debug APK + Android lint
        run: ./gradlew :androidApp:assembleDebug :androidApp:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: elay-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
