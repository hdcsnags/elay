name: android
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint (ktlint + detekt)
        run: ./gradlew ktlintCheck detekt --console=plain
      - name: Unit tests (shared, host)
        run: ./gradlew :shared:allTests --console=plain
      - name: Require executed tests (no hollow green)
        run: |
          count=$(grep -rho 'tests="[0-9]*"' shared/build/test-results --include="TEST-*.xml" | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "executed tests: ${count:-0}"
          test "${count:-0}" -gt 0
      - name: Assemble debug APK + Android lint
        run: ./gradlew :androidApp:assembleDebug :androidApp:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: elay-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk

  release-shape:
    # Stage 5 release lane (contract: "CI asserts shape"): unsigned bundle builds, the
    # merged release manifest carries the hardening flags and exactly one exported
    # component, no println outside ElayLog, and the R8 mapping is archived.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build unsigned release bundle
        run: ./gradlew :androidApp:bundleRelease -Pelay.allowInsecureRelease=true --no-daemon
      - name: Assert release manifest shape
        run: |
          MERGED=androidApp/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          test -f "$MERGED" || MERGED=$(find androidApp/build/intermediates/merged_manifests/release -name AndroidManifest.xml | head -1)
          grep -q 'allowBackup="false"' "$MERGED"
          grep -q 'networkSecurityConfig' "$MERGED"
          ! grep -q 'usesCleartextTraffic="true"' "$MERGED"
          test "$(grep -c 'android:exported="true"' "$MERGED")" = "1"
      - name: Assert no println outside ElayLog
        run: ./gradlew assertNoPrintln --no-daemon
      - name: Archive R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: androidApp/build/outputs/mapping/release/mapping.txt
