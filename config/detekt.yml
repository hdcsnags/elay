# ELAY detekt overrides — defaults apply otherwise (buildUponDefaultConfig = true).
# Keep this file small; every suppression needs a reason.

style:
  MagicNumber:
    active: false # UI dp/sp literals; revisit when the token layer lands (ADR-004)
  ForbiddenMethodCall:
    active: true
    methods:
      # Stage 5 hardening item 5: diagnostics go through ElayLog (release-stripped), never
      # println — a raw println ships user data to logcat in release builds.
      - reason: "Use dev.elay.util.ElayLog (release-stripped) instead of println."
        value: "kotlin.io.println"

naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"] # Composables are PascalCase by convention

complexity:
  TooManyFunctions:
    ignoreAnnotated: ["Dao"] # Room DAOs are wide by design (typed query surfaces)
  LongParameterList:
    ignoreAnnotated: ["Composable"] # state + event lambdas is the idiomatic Compose signature
